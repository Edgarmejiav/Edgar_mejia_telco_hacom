<div class="container mt-4">
  <div class="mb-3 d-flex align-items-center gap-4">
    <label for="search" class="form-label mr-3">Buscar</label>
    <input id="search" class="form-control mr-3" (keyup)="applyFilter($event)" placeholder="Buscar por nombre del autor">
    <button class="btn btn-info ms-auto" (click)="openDialog()">Nuevo</button>
  </div>
  <table mat-table [dataSource]="dataSource" class="table table-bordered table-striped w-100">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <ng-container matColumnDef="gender">
      <th mat-header-cell *matHeaderCellDef> Género </th>
      <td mat-cell *matCellDef="let element"> {{element.gender}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let element">
        <button (click)="editAuthor(element)" class="btn btn-sm btn-link" >
          <i class="fas fa-edit"></i>
        </button>

        <button (click)="deleteAuthor(element)" class="btn btn-sm btn-link" >
          <i class="fas fa-trash"></i>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator
    [length]="totalItems"
    [pageSize]="pageSize"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPaginateChange($event)">
  </mat-paginator>
</div>
